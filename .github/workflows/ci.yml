name: NutriPath CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            NutriPath_Backend/package-lock.json
            NutriPath_Figma/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix NutriPath_Backend

      - name: Test backend
        run: npm test --prefix NutriPath_Backend

      - name: Install frontend dependencies
        run: npm ci --prefix NutriPath_Figma

      - name: Test frontend
        run: npm test --prefix NutriPath_Figma -- --run

      - name: Build frontend
        run: npm run build --prefix NutriPath_Figma
